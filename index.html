  <body>
    <div id="root"></div>
    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>

    <!--
      Aviso de carga fallida.

      GitHub Pages sirve el HTML con `cache-control: max-age=600` y borra los
      ficheros antiguos en cada despliegue. Si el navegador tiene cacheado un
      HTML viejo, este pediría un bundle que ya no existe: la aplicación no
      arranca y la página se queda en blanco. Este aviso detecta ese caso y
      ofrece recargar en lugar de dejar al visitante con una pantalla vacía.

      Los estilos van en línea a propósito: el CSS de la aplicación se carga
      con el bundle, así que si el bundle falla, el CSS tampoco está.
    -->
    <style>
      #root-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        padding: 2rem;
        text-align: center;
        background: #050814;
        color: #eaf1ff;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #root-fallback p {
        margin: 0;
        max-width: 46ch;
        line-height: 1.5;
      }
      #root-fallback p:first-child {
        font-size: 1.28rem;
        font-weight: 700;
      }
      #root-fallback .root-fallback-hint {
        color: #a5b4fc;
        font-size: 0.85rem;
      }
      #root-fallback .root-fallback-errors {
        max-width: 70ch;
        padding: 0.6rem 0.8rem;
        border-radius: 8px;
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #fca5a5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        line-height: 1.5;
        word-break: break-word;
      }
      #root-fallback button {
        padding: 0.6rem 1.4rem;
        border: 0;
        border-radius: 20px;
        background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 55%, #ec4899 100%);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      #root-fallback button:hover {
        filter: brightness(1.1);
      }
    </style>
    <div id="root-fallback" hidden>
      <p>No se ha podido cargar la aplicación.</p>
      <p class="root-fallback-hint">
        Suele pasar con una versión antigua guardada en la caché del navegador.
        Recarga la página para obtener la última versión.
      </p>
      <p class="root-fallback-errors" id="root-fallback-errors" hidden></p>
      <button type="button" onclick="window.location.reload()">Recargar</button>
    </div>

    <script>
      /* Detecta que la aplicación no ha montado y explica por qué. */
      (function () {
        var errores = []

        window.addEventListener(
          'error',
          function (evento) {
            var destino = evento.target
            if (destino && destino !== window && destino.tagName === 'SCRIPT') {
              errores.push('No se ha podido cargar: ' + (destino.src || 'script desconocido'))
            } else {
              errores.push(evento.message || String(evento.error || 'error desconocido'))
            }
          },
          true
        )

        window.addEventListener('unhandledrejection', function (evento) {
          var motivo = evento.reason
          errores.push('Error en asíncronía: ' + (motivo && motivo.message ? motivo.message : String(motivo)))
        })

        setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || root.childElementCount > 0) return

          var aviso = document.getElementById('root-fallback')
          if (aviso) aviso.hidden = false

          if (!errores.length) return
          var detalle = document.getElementById('root-fallback-errors')
          if (detalle) {
            detalle.textContent = errores.join(' · ')
            detalle.hidden = false
          }
        }, 4000)
      })()
    </script>

    <script type="module" src="/src/front/main.tsx"></script>
  </body>
