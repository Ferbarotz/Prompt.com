  POR QUÉ EXISTE ESTE FICHERO
  ============================

  La configuración de Pages de este repositorio está en modo "legacy"

  (.github/workflows/deploy.yml).

  Ambos despliegan al mismo sitio, así que gana el último que termina, y el

  Este fichero hace fallar la construcción de Jekyll de forma intencionada
  (una etiqueta Liquid inexistente), de modo que ese workflow NUNCA publica

  CÓMO ARREGLARLO DE RAÍZ
  =======================

  1. Ve a Settings → Pages → Build and deployment → Source.
  2. Elige "GitHub Actions" en lugar de "Deploy from a branch".
  3. Guarda. GitHub deja de ejecutar el workflow de Jekyll.
  4. Este fichero se puede borrar sin riesgo (o dejarlo: tampoco hace nada).
